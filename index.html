<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendientes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pendientes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una pantalla — título grande arriba, lista con scroll, barra de pestañas fija abajo, botón + flotante y hojas que suben desde abajo */
:root {
  --bg: #EEF1F5;
  --sheet: #FFFFFF;
  --ink: #18202D;
  --muted: #667286;
  --line: #DCE1E9;
  --fill: #E3E8EF;
  --accent: #2B54D6;
  --accent-ink: #FFFFFF;
  --done: #1F8A5B;
  --danger: #C8402B;
  --warn: #C27A0E;
  --l-personal: #2B54D6;
  --l-trabajo: #D2691E;
  --l-casa: #1F8A5B;
  --l-compras: #C23B8A;
  --scrim: rgba(16, 22, 32, .38);
  --shadow: 0 10px 30px rgba(20, 30, 50, .18);
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F131A; --sheet: #19212B; --ink: #E8EDF4; --muted: #95A2B5; --line: #2A3442; --fill: #232D39;
    --accent: #7E9CFF; --accent-ink: #0E1420; --done: #4CC38A; --danger: #F27E68; --warn: #E9A63B;
    --l-personal: #7E9CFF; --l-trabajo: #F0975A; --l-casa: #4CC38A; --l-compras: #EE7DBE;
    --scrim: rgba(0, 0, 0, .55); --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F131A; --sheet: #19212B; --ink: #E8EDF4; --muted: #95A2B5; --line: #2A3442; --fill: #232D39;
  --accent: #7E9CFF; --accent-ink: #0E1420; --done: #4CC38A; --danger: #F27E68; --warn: #E9A63B;
  --l-personal: #7E9CFF; --l-trabajo: #F0975A; --l-casa: #4CC38A; --l-compras: #EE7DBE;
  --scrim: rgba(0, 0, 0, .55); --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body {
  margin: 0; -webkit-text-size-adjust: 100%;
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4;
  overflow: hidden; -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }
.scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 120px;
}
.inner { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* Encabezado */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top-text { min-width: 0; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 400; font-size: 36px; line-height: 1.05; margin: 2px 0 0; }
.ring { flex: none; width: 58px; height: 58px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--fill); }
.ring .bar { stroke: var(--done); transition: stroke-dashoffset .5s ease; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Chips de filtro */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 2px 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px;
  background: var(--sheet); border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* Secciones y filas */
.section { display: flex; flex-direction: column; gap: 8px; }
.section h2 { margin: 0; font-size: 14px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; padding: 0 4px; }
.section h2.late { color: var(--danger); }
.card { background: var(--sheet); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
.row { position: relative; overflow: hidden; }
.row + .row { border-top: 1px solid var(--line); }
.swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-weight: 700; color: #fff; font-size: 14px; }
.swipe-bg.right { background: var(--done); }
.swipe-bg.left { background: var(--danger); justify-content: flex-end; }
.row-main {
  position: relative; background: var(--sheet); display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px;
  touch-action: pan-y; transition: transform .22s ease;
}
.row-main.dragging { transition: none; }
.check {
  flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; color: transparent; margin-top: 1px; transition: background .15s, border-color .15s;
}
.check.alta { border-color: var(--danger); }
.check svg { width: 14px; height: 14px; }
.row.done .check { background: var(--done); border-color: var(--done); color: #fff; }
.row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.row-title { font-size: 17px; overflow-wrap: anywhere; }
.row.done .row-title { text-decoration: line-through; color: var(--muted); }
.row-notes { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row-meta .tag { display: inline-flex; align-items: center; gap: 5px; }
.row-meta .late { color: var(--danger); font-weight: 600; }
.row-meta .today { color: var(--warn); font-weight: 600; }
.row-meta .alta { color: var(--danger); font-weight: 700; }
.row.leaving { animation: leave .35s ease forwards; }
@keyframes leave { to { opacity: 0; transform: translateX(30px); } }

.empty { text-align: center; padding: 44px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.empty b { font-family: var(--display); font-weight: 400; color: var(--ink); font-size: 24px; }
.hint { font-size: 13px; color: var(--muted); text-align: center; }

/* Racha */
.streak { background: var(--sheet); border: 1px solid var(--line); border-radius: 20px; padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.streak .big { font-family: var(--display); font-size: 72px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.streak .lbl { color: var(--muted); font-weight: 600; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; max-width: 360px; margin-top: 12px; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
.week i { width: 30px; height: 30px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; font-style: normal; color: transparent; }
.week i.on { background: var(--done); color: #fff; }
.week i.today { box-shadow: 0 0 0 2px var(--accent); }
.big-btn { width: 100%; min-height: 52px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px; }
.big-btn:disabled { background: var(--fill); color: var(--muted); cursor: default; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
details.setup { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
details.setup summary { font-weight: 600; cursor: pointer; }
details.setup ol { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; -webkit-user-select: text; user-select: text; }
details.setup code { font-size: 14px; background: var(--fill); padding: 1px 5px; border-radius: 5px; }

/* Barra de pestañas y botón + */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--sheet) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tabbar-inner { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 11px; font-weight: 600; color: var(--muted); position: relative; }
.tab svg { width: 25px; height: 25px; }
.tab[aria-selected="true"] { color: var(--accent); }
.badge { position: absolute; top: 0; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.fab {
  position: fixed; z-index: 21; width: 58px; height: 58px; border-radius: 50%;
  right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); display: grid; place-items: center;
}
.fab svg { width: 26px; height: 26px; }
.fab:active { transform: scale(.94); }

/* Hoja inferior */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 92%; overflow-y: auto;
  background: var(--sheet); border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
  padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
}
.sheet.open { transform: translateY(0); }
.sheet-inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 0; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h3 { margin: 0; font-size: 17px; }
.link { color: var(--accent); font-weight: 600; font-size: 16px; padding: 6px 2px; }
.link.strong { font-weight: 700; }
.link:disabled { color: var(--muted); cursor: default; }
.field { width: 100%; font: inherit; color: var(--ink); background: var(--fill); border: 0; border-radius: 12px; padding: 13px 14px; -webkit-user-select: text; user-select: text; }
.field.title { font-size: 19px; font-weight: 600; }
textarea.field { resize: none; min-height: 64px; font-size: 15px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group > label, .group > .glabel { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { padding: 8px 13px; border-radius: 10px; background: var(--fill); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.opt.prio[aria-pressed="true"] { background: var(--danger); color: #fff; }
input[type="date"].field { padding: 9px 12px; width: auto; font-size: 15px; }
.danger-btn { color: var(--danger); font-weight: 700; padding: 12px; border-radius: 12px; background: var(--fill); }

/* Aviso inferior */
.toast {
  position: fixed; z-index: 40; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: all .25s;
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 11px 14px; display: flex; gap: 14px; align-items: center;
  font-size: 15px; box-shadow: var(--shadow); max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { font-weight: 700; color: var(--accent); }
:root:not([data-theme="light"]) .toast button { color: var(--accent); }
.status { font-size: 13px; color: var(--danger); text-align: center; }
.tools { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.tools > * { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 14px; font-size: 16px; text-align: left; }
.tools > * + * { border-top: 1px solid var(--line); }
.tools small { color: var(--muted); font-size: 13px; }
.tools .go { color: var(--accent); font-weight: 600; flex: none; }
.install { background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.install b { font-size: 16px; }
@media (prefers-reduced-motion: reduce) {
  .row-main, .sheet, .scrim, .toast, .ring .bar { transition: none; }
  .row.leaving { animation: none; }
}
</style>
</head>
<body>

<div class="app">
  <main class="scroll" id="scroller">
    <div class="inner">
      <div class="top">
        <div class="top-text">
          <div class="eyebrow" id="eyebrow"></div>
          <h1 id="title">Hoy</h1>
        </div>
        <div class="ring" id="ring" aria-label="Progreso de hoy">
          <svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15.5" fill="none" stroke-width="4"></circle><circle class="bar" id="ringBar" cx="18" cy="18" r="15.5" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="97.4"></circle></svg>
          <span id="ringTxt">0/0</span>
        </div>
      </div>
      <div class="chips" id="chips" hidden></div>
      <div id="view"></div>
      <div class="status" id="status"></div>
    </div>
  </main>

  <button class="fab" id="fab" type="button" aria-label="Nuevo pendiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar">
    <div class="tabbar-inner" role="tablist">
      <button class="tab" role="tab" data-tab="hoy" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        Hoy<span class="badge" id="badge" hidden></span>
      </button>
      <button class="tab" role="tab" data-tab="todos" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>
        Todos
      </button>
      <button class="tab" role="tab" data-tab="hechos" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.7L16.2 9"/></svg>
        Hechos
      </button>
      <button class="tab" role="tab" data-tab="racha" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4 0-7-2.7-7-6.6 0-3.3 2.4-5.4 3.6-8.4.5 2 1.6 3 2.7 3.4C11.2 6.5 12.8 4.3 15 3c-.4 3 1 4.7 2.3 6.3 1 1.3 1.7 2.8 1.7 4.9C19 18.2 16 21 12 21z"/></svg>
        Racha
      </button>
    </div>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-inner">
    <div class="grabber"></div>
    <div class="sheet-head">
      <button class="link" id="cancelBtn" type="button">Cancelar</button>
      <h3 id="sheetTitle">Nuevo pendiente</h3>
      <button class="link strong" id="saveBtn" type="button">Añadir</button>
    </div>
    <input class="field title" id="fText" type="text" placeholder="¿Qué tienes que hacer?" maxlength="200" enterkeyhint="done" autocomplete="off">
    <textarea class="field" id="fNotes" placeholder="Notas (opcional)" maxlength="1000"></textarea>
    <div class="group">
      <div class="glabel">Fecha</div>
      <div class="opts" id="dateOpts"></div>
      <input class="field" id="fDate" type="date" aria-label="Elegir fecha">
    </div>
    <div class="group">
      <div class="glabel">Lista</div>
      <div class="opts" id="listOpts"></div>
    </div>
    <div class="group">
      <div class="glabel">Prioridad</div>
      <div class="opts">
        <button class="opt prio" id="fPrio" type="button" aria-pressed="false">Importante</button>
      </div>
    </div>
    <button class="danger-btn" id="deleteBtn" type="button" hidden>Borrar pendiente</button>
  </div>
</section>

<div class="toast" id="toast" role="status"><span id="toastTxt"></span><button id="toastBtn" type="button">Deshacer</button></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const DAY = 86400000;
  const LISTS = [
    { key: "personal", name: "Personal", color: "var(--l-personal)" },
    { key: "trabajo", name: "Trabajo", color: "var(--l-trabajo)" },
    { key: "casa", name: "Casa", color: "var(--l-casa)" },
    { key: "compras", name: "Compras", color: "var(--l-compras)" },
  ];
  const listOf = (k) => LISTS.find((l) => l.key === k) || LISTS[0];
  const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

  let db = null, items = [], loaded = false, readOnly = false;
  let tab = "hoy", filter = "all", review = { days: [] };
  let form = null; // estado de la hoja abierta

  // ---- fechas ----
  const key = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const today = () => key(new Date());
  const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return key(d); };
  const parse = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const diffDays = (k) => Math.round((parse(k) - parse(today())) / DAY);
  const fmtLong = new Intl.DateTimeFormat("es", { weekday: "long", day: "numeric", month: "long" });
  const fmtShort = new Intl.DateTimeFormat("es", { day: "numeric", month: "short" });
  const fmtWeekday = new Intl.DateTimeFormat("es", { weekday: "long" });
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  function dueLabel(due) {
    if (!due) return null;
    const n = diffDays(due);
    if (n < -1) return { text: "Venció hace " + -n + " días", cls: "late" };
    if (n === -1) return { text: "Venció ayer", cls: "late" };
    if (n === 0) return { text: "Hoy", cls: "today" };
    if (n === 1) return { text: "Mañana", cls: "" };
    if (n < 7) return { text: cap(fmtWeekday.format(parse(due))), cls: "" };
    return { text: fmtShort.format(parse(due)), cls: "" };
  }
  function bucket(it) {
    if (!it.due) return "sin";
    const n = diffDays(it.due);
    return n < 0 ? "vencidos" : n === 0 ? "hoy" : n === 1 ? "manana" : "proximos";
  }
  const doneToday = () => items.filter((i) => i.done && i.doneAt && key(new Date(i.doneAt)) === today());

  // ---- render ----
  function render() {
    const pending = items.filter((i) => !i.done);
    const forToday = pending.filter((i) => i.due && diffDays(i.due) <= 0);
    const dt = doneToday().length;

    // anillo de progreso de hoy
    const total = forToday.length + dt;
    const pct = total ? dt / total : 0;
    $("ringBar").setAttribute("stroke-dashoffset", (97.4 * (1 - pct)).toFixed(1));
    $("ringTxt").textContent = dt + "/" + total;
    $("ring").hidden = tab !== "hoy";

    const late = pending.filter((i) => bucket(i) === "vencidos").length;
    $("badge").hidden = forToday.length === 0;
    $("badge").textContent = forToday.length;
    $("badge").style.background = late ? "var(--danger)" : "var(--warn)";

    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));
    $("eyebrow").textContent = fmtLong.format(new Date());
    $("title").textContent = { hoy: "Hoy", todos: "Todos", hechos: "Hechos", racha: "Racha" }[tab];
    $("fab").hidden = readOnly || tab === "racha";
    renderChips();

    const view = $("view");
    view.textContent = "";
    if (!loaded) { view.innerHTML = '<div class="empty"><b>Cargando…</b>Abriendo tu lista.</div>'; return; }

    if (tab === "hoy") {
      const byPrio = (a, b) => (b.priority === "alta") - (a.priority === "alta") || a.createdAt - b.createdAt;
      const lateItems = forToday.filter((i) => bucket(i) === "vencidos").sort(byPrio);
      const todayItems = forToday.filter((i) => bucket(i) === "hoy").sort(byPrio);
      const noDate = pending.filter((i) => !i.due).sort(byPrio);
      if (!lateItems.length && !todayItems.length && !noDate.length) {
        view.append(empty(dt ? "¡Día completo!" : "Nada para hoy", dt ? "Terminaste " + dt + (dt === 1 ? " pendiente" : " pendientes") + " hoy." : "Toca + para anotar tu primer pendiente."));
      }
      addSection(view, "Vencidos", lateItems, "late");
      addSection(view, "Para hoy", todayItems);
      addSection(view, "Sin fecha", noDate);
      if (dt) addSection(view, "Terminados hoy", doneToday().sort((a, b) => b.doneAt - a.doneAt));
      if (pending.length) view.append(hint("Desliza a la derecha para completar, a la izquierda para borrar."));
    } else if (tab === "todos") {
      const list = pending.filter((i) => filter === "all" || (i.list || "personal") === filter);
      const sortDue = (a, b) => (a.due || "9999").localeCompare(b.due || "9999") || (b.priority === "alta") - (a.priority === "alta") || a.createdAt - b.createdAt;
      if (!list.length) view.append(empty("Lista vacía", filter === "all" ? "Toca + para anotar algo." : "No hay pendientes en " + listOf(filter).name + "."));
      [["vencidos", "Vencidos", "late"], ["hoy", "Hoy"], ["manana", "Mañana"], ["proximos", "Próximos"], ["sin", "Sin fecha"]].forEach(([b, label, cls]) => {
        addSection(view, label, list.filter((i) => bucket(i) === b).sort(sortDue), cls);
      });
    } else if (tab === "hechos") {
      const done = items.filter((i) => i.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
      if (!done.length) view.append(empty("Aún nada terminado", "Cuando completes un pendiente aparecerá aquí."));
      const groups = new Map();
      done.forEach((i) => {
        const k = i.doneAt ? key(new Date(i.doneAt)) : today();
        const n = diffDays(k);
        const label = n === 0 ? "Hoy" : n === -1 ? "Ayer" : cap(fmtLong.format(parse(k)));
        if (!groups.has(label)) groups.set(label, []);
        groups.get(label).push(i);
      });
      groups.forEach((arr, label) => addSection(view, label, arr));
    } else {
      renderStreak(view);
    }
  }

  function addSwipe(r, main, it) {
    let x0 = 0, y0 = 0, dx = 0, active = false, locked = null;
    const bgR = r.querySelector(".swipe-bg");
    main.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      x0 = e.clientX; y0 = e.clientY; dx = 0; active = true; locked = null; delete main.dataset.swiped;
    });
    main.addEventListener("pointermove", (e) => {
      if (!active) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (locked === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) locked = Math.abs(mx) > Math.abs(my) ? "x" : "y";
      if (locked !== "x") return;
      dx = mx;
      main.classList.add("dragging");
      main.style.transform = "translateX(" + dx + "px)";
      bgR.className = "swipe-bg " + (dx > 0 ? "right" : "left");
      bgR.textContent = dx > 0 ? (it.done ? "Pendiente" : "Hecho") : "Borrar";
      main.dataset.swiped = "1";
    });
    const end = () => {
      if (!active) return;
      active = false; main.classList.remove("dragging");
      const w = r.offsetWidth * 0.35;
      if (dx > w) { main.style.transform = "translateX(100%)"; setTimeout(() => toggle(it, r), 160); }
      else if (dx < -w) { main.style.transform = "translateX(-100%)"; setTimeout(() => remove(it), 160); }
      else main.style.transform = "";
      setTimeout(() => delete main.dataset.swiped, 50);
    };
    main.addEventListener("pointerup", end);
    main.addEventListener("pointercancel", () => { active = false; main.classList.remove("dragging"); main.style.transform = ""; });
  }

  // ---- racha ----
  function streakCount() {
    const set = new Set(review.days || []);
    let n = 0; const d = new Date();
    if (!set.has(key(d))) d.setDate(d.getDate() - 1);
    while (set.has(key(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

    const stats = document.createElement("div"); stats.className = "stats";

      tool("Número en el ícono", on ? "Activado: muestra tus pendientes de hoy" : "Muestra en el ícono cuántos pendientes tienes hoy", on ? "✓" : "Activar", async () => {
        if (Notification.permission !== "granted") { try { await Notification.requestPermission(); } catch (e) {} }
        updateBadge(); render();
      });

    const pushCode = readPushCode();
    if ("PushManager" in window && "serviceWorker" in navigator) {
      tool("Aviso diario", pushCode ? "Activado en este iPhone" : "Una notificación al día que abre esta app", pushCode ? "Ver código" : "Activar", enablePush);
    }
    tool("Guardar copia de seguridad", "Descarga un archivo con todos tus pendientes", "Exportar", exportBackup);
    tool("Restaurar copia", "Carga un archivo exportado antes", "Importar", () => $("importFile").click());
    view.append(tools);

    if (pushCode && showPushCode) {
      const box = document.createElement("div"); box.className = "setup";
      box.innerHTML = '<b>Código de tu iPhone</b><p class="hint" style="text-align:left;margin:6px 0 10px">Cópialo y pégalo en GitHub como el secreto <code>SUSCRIPCION</code>. Solo hace falta una vez.</p>';
      const ta = document.createElement("textarea"); ta.className = "field"; ta.id = "pushCode"; ta.readOnly = true; ta.rows = 5;
      ta.style.fontSize = "12px"; ta.value = pushCode;

      b.onclick = async () => {
        try { await navigator.clipboard.writeText(pushCode); toast("Código copiado"); }
        catch (e) { ta.focus(); ta.select(); toast("Selecciónalo y cópialo a mano"); }
      };
      box.append(ta, b); view.append(box);

  // ---- aviso diario (notificaciones push) ----
  const VAPID_PUBLIC = "BGiGmxaStGDBWUpHh-4gcenJMavPPsNIsnqy02JsXF7OArPRIMNO1OsCnw4Zglu6PRTcUFEy5jSBwfsRI107-9U";
  const PUSH_KEY = "pendientes.push";
  let showPushCode = false;
  function readPushCode() { try { return localStorage.getItem(PUSH_KEY); } catch (e) { return null; } }
  function b64ToBytes(s) {
    const pad = "=".repeat((4 - (s.length % 4)) % 4);
    const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
    return Uint8Array.from(raw, (c) => c.charCodeAt(0));
  }
  async function enablePush() {
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !isStandalone()) {
      setStatus("Primero instala la app: en Safari toca Compartir → Agregar a pantalla de inicio, y ábrela desde su ícono.");
      return;
    }
    try {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { setStatus("Sin permiso no puedo enviarte avisos. Actívalo en Ajustes → Notificaciones → Pendientes."); return; }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
      const code = JSON.stringify(sub.toJSON());
      try { localStorage.setItem(PUSH_KEY, code); } catch (e) {}
      showPushCode = true; setStatus(""); updateBadge(); render();
      toast("Avisos activados");
    } catch (e) {
      setStatus("No se pudieron activar los avisos en este dispositivo. Asegúrate de tener iOS 16.4 o más nuevo.");
    }
  }

  // ---- instalación, ícono y copias ----
  function isStandalone() {
    return window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
  }
  function updateBadge() {
    if (!("setAppBadge" in navigator)) return;
    const n = items.filter((i) => !i.done && i.due && diffDays(i.due) <= 0).length;
    try { (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {}); } catch (e) {}
  }
  async function exportBackup() {
    const data = JSON.stringify({ app: "pendientes", version: 1, exportedAt: new Date().toISOString(), data: localDb.dump() }, null, 2);
    const name = "pendientes-" + today() + ".json";
    const file = new File([data], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Copia de Pendientes" }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  async function importBackup(file) {
    try {
      const parsed = JSON.parse(await file.text());
      if (!parsed || parsed.app !== "pendientes" || !parsed.data || typeof parsed.data.pendientes !== "object") throw new Error("formato");
      localDb.restore(parsed.data);
      toast("Copia restaurada: " + Object.keys(parsed.data.pendientes).length + " pendientes");
    } catch (e) { setStatus("Ese archivo no es una copia de Pendientes. Elige el archivo .json que exportaste."); }
  }

  async function save() {

  // ---- almacenamiento en el teléfono ----
  // Misma forma que antes (doc/collection) pero guardado en localStorage del dispositivo.
  const STORE_KEY = "pendientes.v1";
  const localDb = (function () {
    let state = { pendientes: {}, ajustes: {} };
    try { const raw = localStorage.getItem(STORE_KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
    const persist = () => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
      catch (e) { throw { code: "quota_exceeded" }; }
      sync();
    };
    const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    return {
      doc(path) {
        const [c, id] = path.split("/");
        return {
          async set(d) { (state[c] = state[c] || {})[id] = Object.assign({}, d); persist(); },
          async update(d) { const cur = state[c] && state[c][id]; if (!cur) throw { code: "invalid_argument" }; Object.assign(cur, d); persist(); },
          async delete() { if (state[c]) delete state[c][id]; persist(); },
        };
      },
      collection(c) {
        return { async add(d) { const id = newId(); (state[c] = state[c] || {})[id] = Object.assign({}, d); persist(); return { id }; } };
      },
      dump() { return JSON.parse(JSON.stringify(state)); },
      restore(s) { state = { pendientes: s.pendientes || {}, ajustes: s.ajustes || {} }; persist(); },
      read() { return state; },
    };
  })();

  function sync() {
    const s = localDb.read();
    items = Object.entries(s.pendientes || {}).map(([id, d]) => Object.assign({ id }, d));
    const r = (s.ajustes && s.ajustes.revision) || {};
    review = { days: Array.isArray(r.days) ? r.days : [] };
    loaded = true;
    render(); updateBadge();
  }

  $("importFile").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) importBackup(f);
    e.target.value = "";
  });

  // ---- arranque ----
  db = localDb;
  try {
    if (!localStorage.getItem(STORE_KEY)) {
      localDb.doc("pendientes/bienvenida").set({
        text: "Ejemplo: desliza a la derecha para completarme",
        notes: "Toca el texto para editar. Desliza a la izquierda para borrar.",
        due: today(), list: "personal", priority: "alta", done: false, createdAt: Date.now(), doneAt: null,
      });
    }
  } catch (e) {}
  sync();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (!isStandalone() && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
    const tip = document.createElement("div"); tip.className = "install";
    tip.innerHTML = "<b>Instala la app</b>Toca Compartir en Safari y luego “Agregar a pantalla de inicio”. Así se abre a pantalla completa y tus pendientes quedan guardados.";
    $("view").before(tip);
  }
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

  // refresca etiquetas de fecha al pasar la medianoche o al volver a la app
  let lastDay = today();
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); updateBadge(); } }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { lastDay = today(); render(); updateBadge(); } });
})();
</script>
</body>
